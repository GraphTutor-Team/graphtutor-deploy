name: CI - 持续集成

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 代码质量检查
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: 安装依赖
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: 检查代码格式
        run: npm run format:check

      - name: 运行Lint检查
        run: npm run lint

  # 前端测试
  test-frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        working-directory: ./client
        run: npm ci

      - name: 运行测试
        working-directory: ./client
        run: npm test -- --run

      - name: 测试覆盖率
        working-directory: ./client
        run: npm run test:coverage
        continue-on-error: true

  # 后端测试（如果有）
  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        working-directory: ./server
        run: npm ci

      - name: 运行测试（如果有）
        working-directory: ./server
        run: npm test || echo "后端测试未配置"
        continue-on-error: true

  # 构建检查
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: 安装依赖
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: 构建前端
        working-directory: ./client
        run: npm run build
        env:
          NODE_ENV: production

      - name: 检查构建产物
        run: |
          if [ ! -d "client/dist" ]; then
            echo "前端构建失败：dist目录不存在"
            exit 1
          fi
          echo "前端构建成功"

  # 安全检查
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 运行npm audit
        run: |
          npm audit --audit-level=moderate || true
          cd client && npm audit --audit-level=moderate || true
          cd ../server && npm audit --audit-level=moderate || true

