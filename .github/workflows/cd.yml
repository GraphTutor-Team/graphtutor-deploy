name: CD - 持续部署

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: 构建前端
        working-directory: ./client
        run: npm run build

      - name: 部署
        run: echo "部署步骤待配置"

